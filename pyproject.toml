[project]
name = "aqf"
version = "0.1.0"
description = "Satellite air-pollution analysis and forecasting over Chennai (Sentinel-5P + Sentinel-2)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aqf-analysis",
    "aqf-forecast",
    "pytest>=9.1.1",
]

# Each project phase is a workspace member in its own folder, built on this core package.
[tool.uv.workspace]
members = ["Data Analysis", "Forecasting"]

[tool.uv.sources]
aqf-analysis = { workspace = true }
aqf-forecast = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "Data Analysis/tests", "Forecasting/tests"]
addopts = "-p no:cacheprovider"   # no .pytest_cache folder
