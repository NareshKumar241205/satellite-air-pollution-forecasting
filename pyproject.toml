[project]
name = "aqf"
version = "0.1.0"
description = "Satellite air-pollution analysis and forecasting over Chennai (Sentinel-5P + Sentinel-2)"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
aqf = "aqf:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
