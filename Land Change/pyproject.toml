[project]
name = "aqf-land"
version = "0.1.0"
description = "ADR-001: dual-clock land-use change -> Sentinel-5P NO2 change, Tamil Nadu cities"
requires-python = ">=3.13"
dependencies = [
    "aqf",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "tabulate>=0.9",
]

[project.scripts]
aqf-land = "aqf_land.cli:main"

[tool.uv.sources]
aqf = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
