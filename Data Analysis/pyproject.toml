[project]
name = "aqf-analysis"
version = "0.1.0"
description = "Phase 1: exploratory and trend analysis of the Chennai Sentinel-5P / Sentinel-2 data"
requires-python = ">=3.13"
dependencies = [
    "aqf",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
aqf-analysis = "aqf_analysis.cli:main"

[tool.uv.sources]
aqf = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
