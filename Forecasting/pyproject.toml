[project]
name = "aqf-forecast"
version = "0.1.0"
description = "Phase 2: short-term (t+1) and 150-day forecasting of the Chennai Sentinel-5P gas maps"
requires-python = ">=3.13"
dependencies = [
    "aqf",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
aqf-forecast = "aqf_forecast.cli:main"

[tool.uv.sources]
aqf = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
